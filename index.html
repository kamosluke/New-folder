<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DotWork Login Page</title>
    <link rel="stylesheet" href="style.css">
    <a rel="Facebook" href="https://www.facebook.com/"></a>
</head>
<body>
    <div class="container">
        <div class="login-area">
            <h3 ><img src="WhatsApp Image 20.jpg" sizes="-20%" alt="DotWork"></h3>
            <h2>Log in to your Account</h2>
            <p>Welcome back! Select method to log in:</p>
            <div class="social-login">
                <button class="social-button">
                    <a rel="Google" href="https://accounts.google.com/signin"><img src="icons8-google-48.png" alt="Google Icon">Google</a>
                </button>
                <button class="social-button">
                    <a rel="Facebook" href="https://www.facebook.com/login"><img src="facebook.png" alt="Facebook Icon">Facebook</a>
                </button>
            </div>
            <p>or continue with email</p>
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Your email address">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Your password">
            </div>
            <div class="checkbox-group">
              <input type="checkbox" id="remember-me">
              <label for="remember-me">Remember me</label>
            </div>
            <button class="login-button">Log In</button>
            <div class="create-account">
                <p>Don't have an account? <a href="#">Create an account</a></p>
            </div>
        </div>
        <div class="graphic-area">
            <div class="graphic-content">
                <P><h3>Connect with every application.</h3></P>
                <p>Everything you need in an easily customizable dashboard.</p>
            </div>
             <div class="circles">
                <div></div>
                <div></div>
                <div></div>
                <div></div>
            </div>
        </div>
    </div>
</body>
</html>
